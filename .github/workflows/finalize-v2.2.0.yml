name: Finalize v2.2.0

on:
  push:
    paths:
      - '.github/workflows/finalize-v2.2.0.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final Egg and checksum
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib

          p = Path('egg/egg-minecraft-multi-profile-manager-v2.2.0.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          script = data['scripts']['installation']['script']

          old = '''case "$PROFILE" in
              ""|*[!A-Za-z0-9._-]*|*..*|.|..|/*|*/*|*\\\\*)
                  echo "Usage: $0 <profile>" >&2
                  exit 1
                  ;;
          esac
          '''
          new = '''# Match the launcher's Unicode-safe profile-name policy.
          # Korean and other Unicode letters/numbers are allowed; paths, spaces and glob
          # metacharacters remain blocked.
          case "$PROFILE" in
              ""|.|..|.*|*..*|/*|*/*|*\\\\*|*[[:space:]]*|*\\**|*\\?*|*\\[*|*\\]*)
                  echo "Usage: $0 <profile>" >&2
                  exit 1
                  ;;
          esac
          '''

          if old not in script:
              raise SystemExit('Expected manual-backup validation block was not found')

          data['scripts']['installation']['script'] = script.replace(old, new, 1)
          data['_comment'] = ('Pterodactyl Minecraft Multi-Profile Manager v2.2.0. Stable release with '
                              'SERVER_MEMORY=0 support, imported-server detection from logs/versions, '
                              'automatic Java selection, Unicode profile names (including manual backups), '
                              'and per-profile switch backups.')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sha = hashlib.sha256(p.read_bytes()).hexdigest()
          Path('SHA256SUMS.txt').write_text(f'{sha}  {p.name}\n', encoding='utf-8')
          print('SHA256', sha)
          PY
      - name: Commit final synchronization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add egg/egg-minecraft-multi-profile-manager-v2.2.0.json SHA256SUMS.txt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finalize v2.2.0 egg consistency'
          git push
